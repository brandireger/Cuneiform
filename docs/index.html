<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuneiform Lab Binder</title>
<style>
:root{
  --clay:#c96f3f;        /* wedge accent */
  --clay-deep:#9c4d26;
  --ink:#231c14;         /* dark umber ink */
  --ink-soft:#5c5142;
  --tablet:#e9dcc3;      /* clay tablet */
  --tablet-dk:#dcc9a6;
  --page:#f6efe0;        /* paper */
  --page-line:#e4d8c1;
  --rule:#cdb48c;
  --lapis:#2f5d78;       /* dated */
  --verd:#5f7a4a;        /* status good */
  --edge:#b79b6d;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px -12px rgba(60,40,10,.35);
  --mono:"SFMono-Regular",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(circle at 12% -5%, #f0e6d0, transparent 45%),
    radial-gradient(circle at 100% 0%, #efe3c9, transparent 40%),
    #c8b48d;
  background-color:#c8b48d;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 80px}

/* masthead */
.mast{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:14px 20px;margin-bottom:6px;border-bottom:2px solid var(--ink);}
.wedge{font-size:30px;letter-spacing:2px;color:var(--clay-deep);line-height:1}
.mast h1{font-family:var(--serif);font-weight:600;margin:0;font-size:26px;letter-spacing:.2px}
.mast .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.14em;margin-top:3px}
.mast .spacer{flex:1}
.mast .repo{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.mast .repo a{color:var(--clay-deep);text-decoration:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 4px 2px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
  background:var(--page);border:1px solid var(--edge);border-radius:8px;padding:8px 12px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;outline:0;flex:1;font-size:14px;color:var(--ink);font-family:var(--sans)}
.search .k{font-family:var(--mono);font-size:10px;color:var(--ink-soft);border:1px solid var(--edge);border-radius:4px;padding:1px 5px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--tablet);border:1px solid var(--edge);color:var(--ink);border-radius:7px;padding:8px 11px;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{background:var(--tablet-dk)}
.btn.on{background:var(--clay);color:#fff;border-color:var(--clay-deep)}

/* binder body: tab rail + page */
.binder{display:grid;grid-template-columns:186px 1fr;gap:0;margin-top:14px}
.rail{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.tab{position:relative;text-align:left;cursor:pointer;border:0;
  font-family:var(--sans);color:var(--ink);
  background:var(--tablet);border:1px solid var(--edge);border-right:0;
  border-radius:9px 0 0 9px;padding:11px 12px 11px 14px;box-shadow:var(--shadow);
  transition:transform .12s ease, background .12s ease}
.tab:hover{background:var(--tablet-dk);transform:translateX(2px)}
.tab.active{background:var(--page);transform:translateX(6px);z-index:3;border-color:var(--ink)}
.tab .lab{display:block;font-weight:600;font-size:14.5px;font-family:var(--serif)}
.tab .sb{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.25}
.tab .ct{position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.tab .spine{position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:3px;background:var(--clay)}
.tab[data-c="now"] .spine{background:#8a6d3b}
.tab[data-c="p1"] .spine{background:#9a8352}
.tab[data-c="p2"] .spine{background:#7a8a4a}
.tab[data-c="p3"] .spine{background:#4a8a7e}
.tab[data-c="p4"] .spine{background:#4a6f8a}
.tab[data-c="p5"] .spine{background:#8a4a63}
.tab[data-c="exp"] .spine{background:#8a5a2f}
.tab[data-c="ref"] .spine{background:#6b5a3f}

.page{background:var(--page);border:1px solid var(--ink);border-radius:0 12px 12px 12px;
  min-height:70vh;box-shadow:var(--shadow);position:relative;overflow:hidden}
.page:before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1px;background:var(--clay);opacity:.35}
.page:after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;
  background:repeating-linear-gradient(transparent,transparent 31px,var(--page-line) 31px,var(--page-line) 32px);opacity:.5}
.pagehead{position:relative;z-index:2;padding:18px 26px 12px 52px;border-bottom:1.5px solid var(--rule)}
.pagehead h2{font-family:var(--serif);margin:0;font-size:22px;font-weight:600}
.pagehead .meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:4px;letter-spacing:.05em}
.pagenote{position:relative;z-index:2;margin:12px 26px 4px 52px;padding:10px 14px;font-size:13px;
  background:#fff6e2;border:1px dashed var(--edge);border-radius:8px;color:var(--ink-soft);line-height:1.5}

/* doc cards */
.docs{position:relative;z-index:2;padding:8px 22px 26px 44px}
.doc{border:1px solid var(--page-line);border-left:3px solid var(--clay);
  background:rgba(255,255,255,.62);border-radius:8px;margin:12px 0;padding:12px 14px 12px 16px;
  transition:box-shadow .12s ease, border-color .12s ease}
.doc:hover{box-shadow:0 6px 18px -10px rgba(60,40,10,.4);border-left-color:var(--clay-deep)}
.doc.star{border-left-color:#c79a2e;background:linear-gradient(90deg,#fff7e0,rgba(255,255,255,.62) 60%)}
.doc .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.doc .nm{font-family:var(--mono);font-size:13.5px;color:var(--clay-deep);text-decoration:none;font-weight:600;word-break:break-word}
.doc .nm:hover{text-decoration:underline}
.doc .star-b{color:#c79a2e;font-size:13px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:2px 7px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.chip.date{background:#e5eef3;color:var(--lapis);border-color:#bcd2de}
.chip.undated{background:#efe7d6;color:var(--ink-soft);border-color:var(--edge)}
.chip.st{background:#eaf0e2;color:var(--verd);border-color:#c6d5b2}
.chip.st.Superseded,.chip.st.Probe,.chip.st.Audit{background:#f3e6dd;color:var(--clay-deep);border-color:#e0c3ad}
.chip.st.Frozen{background:#e8e4da;color:#6b5a3f;border-color:#cdbc9c}
.doc .an{font-size:13px;color:var(--ink);margin:7px 0 0;line-height:1.5;font-family:var(--serif)}
.doc .why{font-size:12.5px;color:var(--clay-deep);margin:6px 0 0;line-height:1.45;font-style:italic}
.doc .refs{margin-top:9px;font-size:11px;color:var(--ink-soft);font-family:var(--mono);line-height:1.9}
.doc .refs a{color:var(--lapis);text-decoration:none;border-bottom:1px dotted #9db9c6}
.doc .refs a:hover{color:var(--clay-deep)}
.doc .refs .lbl{color:var(--ink-soft);opacity:.7}
.doc .actions{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.mini{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--edge);background:var(--tablet);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink)}
.mini:hover{background:var(--tablet-dk)}
.mini.reading{border-color:var(--clay);color:var(--clay-deep)}
.doc.read{opacity:.62}
.doc.read .nm:before{content:"✓ ";color:var(--verd)}
.notebox{margin-top:9px;width:100%;min-height:0;height:0;overflow:hidden;transition:height .18s ease;
  border:0;background:transparent}
.notebox.open{height:78px}
.notebox textarea{width:100%;height:70px;resize:vertical;font-family:var(--sans);font-size:13px;
  border:1px solid var(--edge);border-radius:7px;padding:8px;background:#fffdf6;color:var(--ink);outline:0}
.notebox textarea:focus{border-color:var(--clay)}

.empty{padding:40px 52px;color:var(--ink-soft);font-family:var(--serif);font-style:italic}

/* footer helpers */
.foot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  margin:16px 4px 0;font-family:var(--mono);font-size:11px;color:#4a3f2e}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.prog{display:flex;align-items:center;gap:8px}
.bar{width:120px;height:7px;border-radius:5px;background:#d9c6a0;overflow:hidden;border:1px solid var(--edge)}
.bar i{display:block;height:100%;background:var(--verd);width:0}

@media (max-width:720px){
  .binder{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}
  .tab{border-radius:9px;border-right:1px solid var(--edge);min-width:150px;flex:0 0 auto}
  .tab.active{transform:translateY(-3px)}
  .page{border-radius:12px}
  .page:before{left:20px}
  .docs{padding-left:22px}.pagehead,.pagenote{padding-left:26px;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

document.getElementById('repolink').href = 'https://github.com/brandireger/Cuneiform';
const GH = DATA.gh;
const store = {
  read: JSON.parse(localStorage.getItem('cf_read')||'{}'),
  reading: JSON.parse(localStorage.getItem('cf_reading')||'{}'),
  notes: JSON.parse(localStorage.getItem('cf_notes')||'{}'),
  tab: localStorage.getItem('cf_tab')||DATA.tabs[0].key,
};
function save(){localStorage.setItem('cf_read',JSON.stringify(store.read));
  localStorage.setItem('cf_reading',JSON.stringify(store.reading));
  localStorage.setItem('cf_notes',JSON.stringify(store.notes));
  localStorage.setItem('cf_tab',store.tab);}
let filterStar=false, filterUnread=false, query='';

const rail=document.getElementById('rail');
function totalRead(){let r=0,t=0;DATA.tabs.forEach(tb=>tb.docs.forEach(d=>{t++;if(store.read[d.path])r++}));return[r,t]}

function buildRail(){
  rail.innerHTML='';
  DATA.tabs.forEach(tb=>{
    const b=document.createElement('button');
    b.className='tab'+(tb.key===store.tab?' active':'');
    b.dataset.c=tb.color;
    const readN=tb.docs.filter(d=>store.read[d.path]).length;
    b.innerHTML=`<span class="spine"></span><span class="lab">${tb.label}</span>
      <span class="sb">${tb.sub}</span><span class="ct">${readN}/${tb.docs.length}</span>`;
    b.onclick=()=>{store.tab=tb.key;save();render()};
    rail.appendChild(b);
  });
}

const docsEl=document.getElementById('docs');
function refName(p){return p.split('/').pop()}
function matches(d){
  if(filterStar && !d.star) return false;
  if(filterUnread && store.read[d.path]) return false;
  if(query){
    const hay=(d.name+' '+(d.annot||'')+' '+(d.why||'')+' '+d.refs.join(' ')+' '+(d.status||'')).toLowerCase();
    if(!hay.includes(query)) return false;
  }
  return true;
}
function render(){
  buildRail();
  const tb=DATA.tabs.find(t=>t.key===store.tab);
  document.getElementById('ph-title').textContent=tb.label+' — '+tb.sub;
  const dated=tb.docs.filter(d=>d.date).length, und=tb.docs.length-dated;
  document.getElementById('ph-meta').textContent=
    `${tb.docs.length} documents · ${dated} dated · ${und} undated`;
  const nb=document.getElementById('ph-note');
  nb.innerHTML = tb.note? `<div class="pagenote">${tb.note}</div>`:'';
  docsEl.innerHTML='';
  const shown=tb.docs.filter(matches);
  if(!shown.length){docsEl.innerHTML='<div class="empty">No documents match here. Clear the filter or switch tabs.</div>';}
  shown.forEach(d=>{
    const card=document.createElement('div');
    card.className='doc'+(d.star?' star':'')+(store.read[d.path]?' read':'');
    const dateChip = d.date
      ? `<span class="chip date">🗓 ${d.date}</span>`
      : `<span class="chip undated">◦ undated</span>`;
    const stChip = d.status? `<span class="chip st ${d.status.replace(/\s/g,'')}">${d.status}</span>`:'';
    const refs = d.refs.length
      ? `<div class="refs"><span class="lbl">↪ references:</span> `+
        d.refs.map(r=>`<a href="${GH}${r}" target="_blank" rel="noopener" title="${r}">${refName(r)}</a>`).join(' · ')+`</div>`
      : '';
    const noteVal = store.notes[d.path]||'';
    card.innerHTML=`
      <div class="top">
        <a class="nm" href="${GH}${d.path}" target="_blank" rel="noopener">${d.name}</a>
        ${d.star?'<span class="star-b">★</span>':''}
        ${dateChip}${stChip}
      </div>
      ${d.annot?`<p class="an">${d.annot}</p>`:''}
      ${d.why?`<p class="why">${d.why}</p>`:''}
      ${refs}
      <div class="actions">
        <button class="mini toggleRead">${store.read[d.path]?'Mark unread':'Mark read'}</button>
        <button class="mini toggleReading ${store.reading[d.path]?'reading':''}">${store.reading[d.path]?'★ Reading':'Add to reading'}</button>
        <button class="mini toggleNote">${noteVal?'Note ✎':'Add note'}</button>
        <span style="flex:1"></span>
        <span style="font-family:var(--mono);font-size:10px;color:var(--ink-soft)">${d.path}</span>
      </div>
      <div class="notebox ${noteVal?'open':''}"><textarea placeholder="Notes & quotations for ${d.name}…">${noteVal.replace(/</g,'&lt;')}</textarea></div>
    `;
    card.querySelector('.toggleRead').onclick=()=>{store.read[d.path]=!store.read[d.path];save();render();updateProg()};
    card.querySelector('.toggleReading').onclick=()=>{store.reading[d.path]=!store.reading[d.path];save();render()};
    const nbx=card.querySelector('.notebox'), ta=nbx.querySelector('textarea');
    card.querySelector('.toggleNote').onclick=()=>{nbx.classList.toggle('open');if(nbx.classList.contains('open'))ta.focus()};
    ta.oninput=()=>{store.notes[d.path]=ta.value;save()};
    docsEl.appendChild(card);
  });
  updateProg();
}
function updateProg(){
  const [r,t]=totalRead();
  document.getElementById('progtxt').textContent=`${r} / ${t} read`;
  document.getElementById('progbar').style.width=(t?Math.round(r/t*100):0)+'%';
}

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
document.getElementById('starBtn').addEventListener('click',e=>{filterStar=!filterStar;e.target.classList.toggle('on',filterStar);render()});
document.getElementById('unreadBtn').addEventListener('click',e=>{filterUnread=!filterUnread;e.target.classList.toggle('on',filterUnread);render()});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('Clear all read marks, reading list, and notes?')){store.read={};store.reading={};store.notes={};save();render()}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('q').focus()}
});
render();
</script>
