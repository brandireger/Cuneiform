<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuneiform Lab Binder</title>
<style>
:root{
  --clay:#c96f3f;--clay-deep:#9c4d26;--ink:#231c14;--ink-soft:#5c5142;
  --tablet:#e9dcc3;--tablet-dk:#dcc9a6;--page:#f6efe0;--page-line:#e4d8c1;
  --rule:#cdb48c;--lapis:#2f5d78;--verd:#5f7a4a;--edge:#b79b6d;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(60,40,10,.35);
  --mono:"SFMono-Regular",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background-color:#c8b48d;
  background:radial-gradient(circle at 12% -5%,#f0e6d0,transparent 45%),radial-gradient(circle at 100% 0%,#efe3c9,transparent 40%),#c8b48d;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 80px}
.mast{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:14px 20px;margin-bottom:6px;border-bottom:2px solid var(--ink)}
.wedge{font-size:30px;letter-spacing:2px;color:var(--clay-deep);line-height:1}
.mast h1{font-family:var(--serif);font-weight:600;margin:0;font-size:26px}
.mast .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.14em;margin-top:3px}
.mast .spacer{flex:1}
.mast .repo{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.mast .repo a{color:var(--clay-deep);text-decoration:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 4px 2px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--page);border:1px solid var(--edge);border-radius:8px;padding:8px 12px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;outline:0;flex:1;font-size:14px;color:var(--ink);font-family:var(--sans)}
.search .k{font-family:var(--mono);font-size:10px;color:var(--ink-soft);border:1px solid var(--edge);border-radius:4px;padding:1px 5px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--tablet);border:1px solid var(--edge);color:var(--ink);border-radius:7px;padding:8px 11px;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{background:var(--tablet-dk)}
.btn.on{background:var(--clay);color:#fff;border-color:var(--clay-deep)}
.binder{display:grid;grid-template-columns:186px 1fr;gap:0;margin-top:14px}
.rail{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.tab{position:relative;text-align:left;cursor:pointer;border:0;font-family:var(--sans);color:var(--ink);background:var(--tablet);border:1px solid var(--edge);border-right:0;border-radius:9px 0 0 9px;padding:11px 12px 11px 14px;box-shadow:var(--shadow);transition:transform .12s ease,background .12s ease}
.tab:hover{background:var(--tablet-dk);transform:translateX(2px)}
.tab.active{background:var(--page);transform:translateX(6px);z-index:3;border-color:var(--ink)}
.tab .lab{display:block;font-weight:600;font-size:14.5px;font-family:var(--serif)}
.tab .sb{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.25}
.tab .ct{position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.tab .spine{position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:3px;background:var(--clay)}
.tab[data-c=now] .spine{background:#8a6d3b}.tab[data-c=p1] .spine{background:#9a8352}
.tab[data-c=p2] .spine{background:#7a8a4a}.tab[data-c=p3] .spine{background:#4a8a7e}
.tab[data-c=p4] .spine{background:#4a6f8a}.tab[data-c=p5] .spine{background:#8a4a63}
.tab[data-c=exp] .spine{background:#8a5a2f}.tab[data-c=ref] .spine{background:#6b5a3f}
.page{background:var(--page);border:1px solid var(--ink);border-radius:0 12px 12px 12px;min-height:70vh;box-shadow:var(--shadow);position:relative;overflow:hidden}
.page:before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1px;background:var(--clay);opacity:.35}
.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent,transparent 31px,var(--page-line) 31px,var(--page-line) 32px);opacity:.5}
.pagehead{position:relative;z-index:2;padding:18px 26px 12px 52px;border-bottom:1.5px solid var(--rule)}
.pagehead h2{font-family:var(--serif);margin:0;font-size:22px;font-weight:600}
.pagehead .meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:4px;letter-spacing:.05em}
.pagenote{position:relative;z-index:2;margin:12px 26px 4px 52px;padding:10px 14px;font-size:13px;background:#fff6e2;border:1px dashed var(--edge);border-radius:8px;color:var(--ink-soft);line-height:1.5}
.docs{position:relative;z-index:2;padding:8px 22px 26px 44px}
.doc{border:1px solid var(--page-line);border-left:3px solid var(--clay);background:rgba(255,255,255,.62);border-radius:8px;margin:12px 0;padding:12px 14px 12px 16px;transition:box-shadow .12s ease,border-color .12s ease}
.doc:hover{box-shadow:0 6px 18px -10px rgba(60,40,10,.4);border-left-color:var(--clay-deep)}
.doc.star{border-left-color:#c79a2e;background:linear-gradient(90deg,#fff7e0,rgba(255,255,255,.62) 60%)}
.doc .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.doc .nm{font-family:var(--mono);font-size:13.5px;color:var(--clay-deep);text-decoration:none;font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left;word-break:break-word}
.doc .nm:hover{text-decoration:underline}
.doc .star-b{color:#c79a2e;font-size:13px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:2px 7px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.chip.date{background:#e5eef3;color:var(--lapis);border-color:#bcd2de}
.chip.undated{background:#efe7d6;color:var(--ink-soft);border-color:var(--edge)}
.chip.st{background:#eaf0e2;color:var(--verd);border-color:#c6d5b2}
.chip.st.Superseded,.chip.st.Probe,.chip.st.Audit{background:#f3e6dd;color:var(--clay-deep);border-color:#e0c3ad}
.chip.st.Frozen{background:#e8e4da;color:#6b5a3f;border-color:#cdbc9c}
.doc .an{font-size:13px;color:var(--ink);margin:7px 0 0;line-height:1.5;font-family:var(--serif)}
.doc .why{font-size:12.5px;color:var(--clay-deep);margin:6px 0 0;line-height:1.45;font-style:italic}
.doc .refs{margin-top:9px;font-size:11px;color:var(--ink-soft);font-family:var(--mono);line-height:1.9}
.doc .refs a{color:var(--lapis);text-decoration:none;border-bottom:1px dotted #9db9c6;cursor:pointer}
.doc .refs a:hover{color:var(--clay-deep)}
.doc .refs .lbl{color:var(--ink-soft);opacity:.7}
.doc .actions{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.mini{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--edge);background:var(--tablet);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink)}
.mini:hover{background:var(--tablet-dk)}
.mini.reading{border-color:var(--clay);color:var(--clay-deep)}
.mini.hasnote{border-color:var(--lapis);color:var(--lapis)}
.doc.read{opacity:.62}
.doc.read .nm:before{content:"✓ ";color:var(--verd)}
.empty{padding:40px 52px;color:var(--ink-soft);font-family:var(--serif);font-style:italic}
.foot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:16px 4px 0;font-family:var(--mono);font-size:11px;color:#4a3f2e}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.prog{display:flex;align-items:center;gap:8px}
.bar{width:120px;height:7px;border-radius:5px;background:#d9c6a0;overflow:hidden;border:1px solid var(--edge)}
.bar i{display:block;height:100%;background:var(--verd);width:0}

/* ===== Reader overlay ===== */
.reader{position:fixed;inset:0;z-index:50;display:none}
.reader.open{display:block}
.reader .scrim{position:absolute;inset:0;background:rgba(40,28,12,.55);backdrop-filter:blur(2px)}
.reader .panel{position:absolute;inset:3vh 3vw;background:var(--page);border:1px solid var(--ink);
  border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.rbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1.5px solid var(--rule);background:var(--tablet);flex-wrap:wrap}
.rbar .rname{font-family:var(--mono);font-size:13px;color:var(--clay-deep);font-weight:600;flex:1;min-width:160px;word-break:break-word}
.rbar .rdate{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.rbody{flex:1;display:flex;overflow:hidden;position:relative}
.rdoc{flex:1;overflow:auto;padding:26px 34px 60px;line-height:1.66;font-size:15.5px;color:var(--ink);position:relative}
.rdoc:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent,transparent 31px,var(--page-line) 31px,var(--page-line) 32px);opacity:.35;z-index:0}
.rdoc>*{position:relative;z-index:1}
.rdoc h1,.rdoc h2,.rdoc h3{font-family:var(--serif);line-height:1.25;margin:1.3em 0 .5em}
.rdoc h1{font-size:25px;border-bottom:1px solid var(--rule);padding-bottom:.2em}
.rdoc h2{font-size:20px}.rdoc h3{font-size:17px}
.rdoc p{margin:.7em 0}
.rdoc code{font-family:var(--mono);font-size:.86em;background:#efe6d2;padding:1px 5px;border-radius:4px}
.rdoc pre{background:#2c261c;color:#f2e9d5;padding:12px 14px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.5}
.rdoc pre code{background:none;color:inherit;padding:0}
.rdoc blockquote{margin:.8em 0;padding:.3em 1em;border-left:3px solid var(--clay);background:#fff6e2;color:var(--ink-soft)}
.rdoc table{border-collapse:collapse;margin:1em 0;font-size:13px;width:100%}
.rdoc th,.rdoc td{border:1px solid var(--rule);padding:6px 9px;text-align:left}
.rdoc th{background:var(--tablet)}
.rdoc a{color:var(--lapis)}
.rdoc ul,.rdoc ol{padding-left:1.4em;margin:.6em 0}
.rdoc .loading,.rdoc .err{font-family:var(--mono);font-size:13px;color:var(--ink-soft);padding:20px 0}
.rdoc .err{color:var(--clay-deep)}
.rdoc mark{background:#ffe9a8;padding:0 2px;border-radius:2px}
.selbar{position:absolute;z-index:5;display:none;gap:6px;background:var(--ink);border-radius:8px;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.selbar button{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;background:var(--tablet);border:0;border-radius:5px;padding:5px 9px;cursor:pointer;color:var(--ink)}
.selbar button:hover{background:#fff}

/* Notes drawer slides over reader from the right */
.notes{position:absolute;top:0;right:0;bottom:0;width:min(420px,86%);background:#fffdf6;border-left:2px solid var(--ink);
  transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-16px 0 40px -20px rgba(0,0,0,.5);z-index:6}
.notes.open{transform:translateX(0)}
.notes h3{font-family:var(--serif);margin:0;padding:14px 16px 10px;font-size:17px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px}
.notes .nsub{font-family:var(--mono);font-size:10px;color:var(--ink-soft);padding:0 16px 8px;border-bottom:1px solid var(--rule)}
.notes .qwrap{flex:1;overflow:auto;padding:12px 14px}
.notes textarea{width:100%;min-height:130px;resize:vertical;font-family:var(--sans);font-size:14px;border:1px solid var(--edge);border-radius:8px;padding:10px;background:#fff;color:var(--ink);outline:0}
.notes textarea:focus{border-color:var(--clay)}
.qlist{margin-top:12px}
.qlabel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:6px 0}
.quote{position:relative;font-size:13px;line-height:1.5;background:#fff6e2;border:1px solid var(--edge);border-left:3px solid var(--clay);border-radius:7px;padding:8px 26px 8px 10px;margin:7px 0;font-family:var(--serif)}
.quote .x{position:absolute;top:5px;right:6px;border:0;background:none;color:var(--clay-deep);cursor:pointer;font-size:14px;line-height:1}
.quote .cite{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);margin-top:5px;font-style:normal}
.icon{border:0;background:var(--tablet);border:1px solid var(--edge);border-radius:7px;width:34px;height:32px;cursor:pointer;font-size:15px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon:hover{background:var(--tablet-dk)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#f6efe0;font-family:var(--mono);font-size:12px;padding:9px 16px;border-radius:8px;z-index:99;transition:all .2s ease;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:720px){
  .binder{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}
  .tab{border-radius:9px;border-right:1px solid var(--edge);min-width:150px;flex:0 0 auto}
  .tab.active{transform:translateY(-3px)}
  .page{border-radius:12px}.page:before{left:20px}
  .docs{padding-left:22px}.pagehead,.pagenote{padding-left:26px;margin-left:0}
  .reader .panel{inset:0;border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="wedge">𒀭𒌋𒁀</div>
    <div><h1>Cuneiform Lab Binder</h1>
      <div class="sub">Hittite fragment matching · evidence-bounded reconstruction</div></div>
    <div class="spacer"></div>
    <div class="repo">repo · <a href="https://github.com/brandireger/Cuneiform" target="_blank" rel="noopener">brandireger/Cuneiform</a><br>
      <span>reader · in-frame edition</span></div>
  </div>
  <div class="tools">
    <div class="search"><span class="wedge" style="font-size:14px">𒁹</span>
      <input id="q" placeholder="Filter documents, annotations, references…" autocomplete="off">
      <span class="k">/</span></div>
    <button class="btn" id="starBtn">★ One-hour path</button>
    <button class="btn" id="unreadBtn">Unread only</button>
    <button class="btn" id="exportBtn">⎘ Export to Google Docs</button>
    <button class="btn" id="resetBtn">Reset marks</button>
  </div>
  <div class="binder">
    <div class="rail" id="rail"></div>
    <div class="page">
      <div class="pagehead"><h2 id="ph-title">—</h2><div class="meta" id="ph-meta"></div></div>
      <div id="ph-note"></div>
      <div class="docs" id="docs"></div>
    </div>
  </div>
  <div class="foot">
    <div class="legend">
      <span><i class="dot" style="background:var(--lapis)"></i>dated</span>
      <span><i class="dot" style="background:var(--edge)"></i>undated</span>
      <span><i class="dot" style="background:#c79a2e"></i>one-hour path</span>
      <span><i class="dot" style="background:var(--verd)"></i>read</span></div>
    <div class="prog"><span id="progtxt">0 / 0 read</span><span class="bar"><i id="progbar"></i></span></div>
  </div>
</div>

<!-- Reader overlay -->
<div class="reader" id="reader">
  <div class="scrim" id="scrim"></div>
  <div class="panel">
    <div class="rbar">
      <span class="rname" id="rname">—</span>
      <span class="rdate" id="rdate"></span>
      <button class="mini" id="rReadBtn">Mark read</button>
      <button class="icon" id="notesToggle" title="Notes (n)">✎</button>
      <a class="icon" id="rGithub" href="#" target="_blank" rel="noopener" title="Open on GitHub" style="text-decoration:none">↗</a>
      <button class="icon" id="rClose" title="Close (Esc)">✕</button>
    </div>
    <div class="rbody">
      <div class="rdoc" id="rdoc"><div class="loading">Loading…</div></div>
      <div class="selbar" id="selbar"><button id="saveQuote">＋ Save quotation</button><button id="hlQuote">✎ Note on this</button></div>
      <div class="notes" id="notes">
        <h3>✎ Notes <span style="flex:1"></span>
          <button class="icon" id="notesClose" title="Close">✕</button></h3>
        <div class="nsub" id="notesFor">—</div>
        <div class="qwrap">
          <div class="qlabel">My note</div>
          <textarea id="noteText" placeholder="Free-form notes, reactions, questions…"></textarea>
          <div class="qlist" id="qlist"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  const dated=tb.docs.filter(d=>d.date).length;
  document.getElementById('ph-meta').textContent=`${tb.docs.length} documents · ${dated} dated · ${tb.docs.length-dated} undated`;
  document.getElementById('ph-note').innerHTML=tb.note?`<div class="pagenote">${tb.note}</div>`:'';
  docsEl.innerHTML='';
  const shown=tb.docs.filter(matches);
  if(!shown.length)docsEl.innerHTML='<div class="empty">No documents match here. Clear the filter or switch tabs.</div>';
  shown.forEach(d=>{
    const card=document.createElement('div');
    card.className='doc'+(d.star?' star':'')+(store.read[d.path]?' read':'');
    const dateChip=d.date?`<span class="chip date">🗓 ${d.date}</span>`:`<span class="chip undated">◦ undated</span>`;
    const stChip=d.status?`<span class="chip st ${d.status.replace(/\s/g,'')}">${d.status}</span>`:'';
    const hasNote=(store.notes[d.path]||'').trim()||(store.quotes[d.path]||[]).length;
    const refs=d.refs.length?`<div class="refs"><span class="lbl">↪ references:</span> `+
      d.refs.map(r=>`<a data-open="${r}" title="${r}">${refName(r)}</a>`).join(' · ')+`</div>`:'';
    card.innerHTML=`<div class="top">
        <button class="nm" data-open="${d.path}">${d.name}</button>
        ${d.star?'<span class="star-b">★</span>':''}${dateChip}${stChip}</div>
      ${d.annot?`<p class="an">${d.annot}</p>`:''}
      ${d.why?`<p class="why">${d.why}</p>`:''}${refs}
      <div class="actions">
        <button class="mini toggleRead">${store.read[d.path]?'Mark unread':'Mark read'}</button>
        <button class="mini toggleReading ${store.reading[d.path]?'reading':''}">${store.reading[d.path]?'★ Reading':'Add to reading'}</button>
        <button class="mini openNote ${hasNote?'hasnote':''}" data-open="${d.path}">${hasNote?'✎ Notes':'Add note'}</button>
        <span style="flex:1"></span>
        <span style="font-family:var(--mono);font-size:10px;color:var(--ink-soft)">${d.path}</span></div>`;
    card.querySelector('.toggleRead').onclick=()=>{store.read[d.path]=!store.read[d.path];save();render();};
    card.querySelector('.toggleReading').onclick=()=>{store.reading[d.path]=!store.reading[d.path];save();render();};
    docsEl.appendChild(card);
  });
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',e=>{
    const p=el.getAttribute('data-open');
    if(el.classList.contains('openNote'))openReader(p,true);else openReader(p,false);
  }));
  updateProg();
}
function updateProg(){const[r,t]=totalRead();document.getElementById('progtxt').textContent=`${r} / ${t} read`;document.getElementById('progbar').style.width=(t?Math.round(r/t*100):0)+'%';}

/* ---------- tiny markdown renderer ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMd(md){
  const lines=md.replace(/\r/g,'').split('\n');let html='',i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^```/.test(l)){let buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(esc(lines[i]));i++;}i++;html+=`<pre><code>${buf.join('\n')}</code></pre>`;continue;}
    if(/^#{1,6}\s/.test(l)){const n=l.match(/^#+/)[0].length;html+=`<h${n}>${inlineMd(l.replace(/^#+\s/,''))}</h${n}>`;i++;continue;}
    if(/^\s*>/.test(l)){let buf=[];while(i<lines.length&&/^\s*>/.test(lines[i])){buf.push(inlineMd(lines[i].replace(/^\s*>\s?/,'')));i++;}html+=`<blockquote>${buf.join('<br>')}</blockquote>`;continue;}
    if(/^\s*\|.*\|/.test(l)&&i+1<lines.length&&/^\s*\|[-:\s|]+\|/.test(lines[i+1])){
      const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let t='<table><thead><tr>'+cells(rows[0]).map(c=>`<th>${inlineMd(c)}</th>`).join('')+'</tr></thead><tbody>';
      for(let k=2;k<rows.length;k++)t+='<tr>'+cells(rows[k]).map(c=>`<td>${inlineMd(c)}</td>`).join('')+'</tr>';
      html+=t+'</tbody></table>';continue;}
    if(/^\s*[-*+]\s/.test(l)){let buf=[];while(i<lines.length&&/^\s*[-*+]\s/.test(lines[i])){buf.push(`<li>${inlineMd(lines[i].replace(/^\s*[-*+]\s/,''))}</li>`);i++;}html+=`<ul>${buf.join('')}</ul>`;continue;}
    if(/^\s*\d+\.\s/.test(l)){let buf=[];while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i])){buf.push(`<li>${inlineMd(lines[i].replace(/^\s*\d+\.\s/,''))}</li>`);i++;}html+=`<ol>${buf.join('')}</ol>`;continue;}
    if(/^\s*(---|\*\*\*|___)\s*$/.test(l)){html+='<hr>';i++;continue;}
    if(l.trim()===''){i++;continue;}
    let buf=[l];i++;while(i<lines.length&&lines[i].trim()!==''&&!/^(#{1,6}\s|\s*>|\s*[-*+]\s|\s*\d+\.\s|```|\s*\|)/.test(lines[i])){buf.push(lines[i]);i++;}
    html+=`<p>${inlineMd(buf.join(' '))}</p>`;
  }
  return html;
}

/* ---------- reader overlay ---------- */
const reader=document.getElementById('reader'),rdoc=document.getElementById('rdoc'),
  rname=document.getElementById('rname'),rdate=document.getElementById('rdate'),
  notes=document.getElementById('notes'),noteText=document.getElementById('noteText'),
  notesFor=document.getElementById('notesFor'),qlist=document.getElementById('qlist');
let current=null;
const mdCache={};
async function openReader(path,withNotes){
  const d=byPath[path]; if(!d){toast('Unknown doc');return;}
  current=path;
  reader.classList.add('open');
  rname.textContent=d.name;
  rdate.textContent=d.date?('🗓 '+d.date):'◦ undated';
  document.getElementById('rGithub').href=GH+path;
  document.getElementById('rReadBtn').textContent=store.read[path]?'Mark unread':'Mark read';
  loadNotes(path);
  if(withNotes)notes.classList.add('open');else notes.classList.remove('open');
  rdoc.scrollTop=0;
  rdoc.innerHTML='<div class="loading">Loading '+esc(d.name)+' …</div>';
  try{
    let md=mdCache[path];
    if(md===undefined){const res=await fetch(RAW+path);if(!res.ok)throw new Error('HTTP '+res.status);md=await res.text();mdCache[path]=md;}
    rdoc.innerHTML=renderMd(md);
  }catch(e){
    rdoc.innerHTML='<div class="err">Couldn\'t load this document in-frame ('+esc(e.message)+
      ').<br><br>This can happen offline, or before the file is pushed to GitHub. '+
      'Use the ↗ button to open it on GitHub instead.</div>';
  }
}
function closeReader(){reader.classList.remove('open');notes.classList.remove('open');current=null;}
document.getElementById('rClose').onclick=closeReader;
document.getElementById('scrim').onclick=closeReader;
document.getElementById('notesToggle').onclick=()=>notes.classList.toggle('open');
document.getElementById('notesClose').onclick=()=>notes.classList.remove('open');
document.getElementById('rReadBtn').onclick=()=>{store.read[current]=!store.read[current];save();document.getElementById('rReadBtn').textContent=store.read[current]?'Mark unread':'Mark read';render();};

/* ---------- notes + quotes ---------- */
function loadNotes(path){
  const d=byPath[path];
  notesFor.textContent=d.name+(d.date?'  ·  '+d.date:'');
  noteText.value=store.notes[path]||'';
  renderQuotes(path);
}
noteText.addEventListener('input',()=>{store.notes[current]=noteText.value;save();});
function renderQuotes(path){
  const qs=store.quotes[path]||[];
  qlist.innerHTML=qs.length?'<div class="qlabel">Saved quotations ('+qs.length+')</div>':'';
  qs.forEach((q,idx)=>{
    const div=document.createElement('div');div.className='quote';
    div.innerHTML=`“${esc(q.text)}”<span class="cite">— ${esc(byPath[path].name)}${byPath[path].date?', '+byPath[path].date:''} · ${esc(path)}</span><button class="x" title="Remove">✕</button>`;
    div.querySelector('.x').onclick=()=>{store.quotes[path].splice(idx,1);save();renderQuotes(path);render();};
    qlist.appendChild(div);
  });
}
/* selection → floating save bar */
const selbar=document.getElementById('selbar');let lastSel='';
rdoc.addEventListener('mouseup',()=>{
  const sel=window.getSelection();const txt=(sel&&sel.toString().trim())||'';
  if(txt.length>0){lastSel=txt;const r=sel.getRangeAt(0).getBoundingClientRect();const pr=reader.getBoundingClientRect();
    selbar.style.display='flex';
    selbar.style.left=Math.max(8,r.left-pr.left)+'px';
    selbar.style.top=Math.max(8,r.top-pr.top-44)+'px';
  }else selbar.style.display='none';
});
document.getElementById('saveQuote').onclick=()=>{
  if(!lastSel||!current)return;
  (store.quotes[current]=store.quotes[current]||[]).push({text:lastSel.slice(0,600),ts:Date.now()});
  save();renderQuotes(current);render();selbar.style.display='none';window.getSelection().removeAllRanges();
  toast('Quotation saved');
};
document.getElementById('hlQuote').onclick=()=>{
  if(!current)return;notes.classList.add('open');
  if(lastSel){const pre=noteText.value?noteText.value+'\n\n':'';noteText.value=pre+'“'+lastSel+'” — ';store.notes[current]=noteText.value;save();noteText.focus();}
  selbar.style.display='none';
};

/* ---------- Google Docs export ---------- */
function buildExport(){
  const lines=[];
  lines.push('CUNEIFORM LAB BINDER — READING NOTES');
  lines.push('Repository: github.com/brandireger/Cuneiform');
  lines.push('Exported: '+new Date().toLocaleString());
  const[r,t]=totalRead();lines.push('Progress: '+r+' of '+t+' documents read');
  lines.push('');lines.push('════════════════════════════════════════');lines.push('');
  DATA.tabs.forEach(tb=>{
    const entries=tb.docs.filter(d=>(store.notes[d.path]||'').trim()||(store.quotes[d.path]||[]).length||store.read[d.path]||store.reading[d.path]);
    if(!entries.length)return;
    lines.push('■ '+tb.label.toUpperCase()+' — '+tb.sub);lines.push('');
    entries.forEach(d=>{
      const marks=[];if(store.read[d.path])marks.push('read');if(store.reading[d.path])marks.push('reading-list');
      lines.push('  ▸ '+d.name+(d.date?'  ['+d.date+']':'  [undated]')+(marks.length?'  ('+marks.join(', ')+')':''));
      lines.push('    Source: '+GH+d.path);
      const note=(store.notes[d.path]||'').trim();
      if(note){lines.push('    Note:');note.split('\n').forEach(x=>lines.push('      '+x));}
      const qs=store.quotes[d.path]||[];
      if(qs.length){lines.push('    Quotations:');qs.forEach(q=>{lines.push('      “'+q.text+'”');lines.push('        — '+d.name+(d.date?', '+d.date:'')+' ('+d.path+')');});}
      lines.push('');
    });
    lines.push('');
  });
  if(lines.length<=7)lines.push('(No notes, quotations, or marks yet — read a document and save some.)');
  return lines.join('\n');
}
document.getElementById('exportBtn').onclick=async()=>{
  const text=buildExport();
  try{await navigator.clipboard.writeText(text);}catch(e){}
  // also drop a .txt download as a fallback
  const blob=new Blob([text],{type:'text/plain'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='cuneiform_reading_notes.txt';a.click();URL.revokeObjectURL(url);
  // open a blank Google Doc ready to paste into
  window.open('https://docs.google.com/document/create','_blank','noopener');
  toast('Notes copied + downloaded — paste into the new Google Doc (Ctrl/⌘-V)');
};

/* ---------- global keys ---------- */
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render();});
document.getElementById('starBtn').addEventListener('click',e=>{filterStar=!filterStar;e.target.classList.toggle('on',filterStar);render();});
document.getElementById('unreadBtn').addEventListener('click',e=>{filterUnread=!filterUnread;e.target.classList.toggle('on',filterUnread);render();});
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('Clear all read marks, reading list, notes, and quotations?')){store.read={};store.reading={};store.notes={};store.quotes={};save();render();}});
document.addEventListener('keydown',e=>{
  const typing=['TEXTAREA','INPUT'].includes(document.activeElement.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();document.getElementById('q').focus();}
  if(e.key==='Escape'&&reader.classList.contains('open')){if(notes.classList.contains('open'))notes.classList.remove('open');else closeReader();}
  if(e.key==='n'&&reader.classList.contains('open')&&!typing){notes.classList.toggle('open');}
});
render();
</script>
